<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%232563eb'/%3E%3Cpath d='M68 42l14-9a2 2 0 013 1.7v30.6a2 2 0 01-3 1.7l-14-9V42zM20 32h40a6 6 0 016 6v24a6 6 0 01-6 6H20a6 6 0 01-6-6V38a6 6 0 016-6z' fill='white'/%3E%3C/svg%3E" />
  <link rel="manifest" href="manifest.json" />
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin />
  <link rel="dns-prefetch" href="https://cdnjs.cloudflare.com" />
  <link rel="preconnect" href="https://camera-app-backend-q7p5.onrender.com" crossorigin />
  <link rel="dns-prefetch" href="https://camera-app-backend-q7p5.onrender.com" />
  <title>CamGuard Viewer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.8.1/socket.io.min.js" crossorigin="anonymous"></script>
  <style>
    * { box-sizing: border-box; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0; min-height: 100vh;
      background:
        radial-gradient(ellipse 80% 50% at 20% -10%, rgba(37, 99, 235, 0.18), transparent),
        radial-gradient(ellipse 60% 45% at 85% 110%, rgba(99, 102, 241, 0.14), transparent),
        #050811;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #remoteVideo { width: 100%; height: 100%; object-fit: contain; background: #000; }
    .glass {
      background: rgba(15, 23, 42, 0.75);
      border: 1px solid rgba(148, 163, 184, 0.13);
      box-shadow: 0 10px 35px -10px rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(20px);
    }
    .pulse { animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
    .btn {
      cursor: pointer; border: none; outline: none; position: relative;
      box-shadow: 0 3px 0 rgba(0, 0, 0, 0.45), 0 4px 12px rgba(0, 0, 0, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.14);
      transition: transform .12s ease, filter .18s ease, box-shadow .12s ease, background-color .18s ease;
      touch-action: manipulation; -webkit-tap-highlight-color: transparent;
    }
    .btn:hover:not(:disabled) {
      transform: translateY(-1px);
      filter: brightness(1.12);
      box-shadow: 0 4px 0 rgba(0, 0, 0, 0.48), 0 8px 18px rgba(37, 99, 235, 0.22), inset 0 1px 0 rgba(255, 255, 255, 0.22);
    }
    .btn:focus-visible:not(:disabled) {
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.45), 0 3px 0 rgba(0, 0, 0, 0.45);
    }
    .btn:active:not(:disabled) {
      transform: translateY(2px) scale(0.98);
      filter: brightness(0.95);
      box-shadow: 0 1px 0 rgba(0, 0, 0, 0.5), inset 0 2px 5px rgba(0, 0, 0, 0.35);
    }
    .btn:disabled {
      opacity: .4; cursor: default; transform: none;
      box-shadow: none;
    }
    #videoContainer {
      position: relative; background: #02040a; width: 100%; height: 100%;
      border-radius: 14px; overflow: hidden;
      border: 1px solid rgba(148, 163, 184, 0.12);
    }
    input[type="text"], input[type="email"], input[type="password"] {
      background: rgba(9, 14, 28, 0.9);
      border: 1px solid rgba(51, 65, 85, 0.85);
      color: #f8fafc;
      border-radius: 10px; padding: 10px 13px; width: 100%; outline: none; font-size: 14px;
      transition: border-color .2s, box-shadow .2s;
    }
    input:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.18);
    }
    .log-entry { font-size: 11px; line-height: 1.45; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; padding: 2px 0; word-break: break-word; }
    #screenshotCanvas { display: none; }
    .camera-btn { padding: 7px 12px; border-radius: 9px; font-size: 12px; font-weight: 600; touch-action: manipulation; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.25); border-radius: 999px; }
  </style>
</head>
<body>

<!-- ══════════════════ LOGIN GATE ══════════════════ -->
<div id="loginGate" class="fixed inset-0 z-[100] bg-[#050811]/95 backdrop-blur-md flex items-center justify-center p-3 sm:p-4 overflow-y-auto">
  <div class="glass rounded-2xl sm:rounded-3xl p-5 sm:p-8 w-full max-w-md border border-slate-700/50 my-auto">
    <div class="flex flex-col items-center text-center mb-5 sm:mb-7">
      <div class="w-12 h-12 sm:w-14 sm:h-14 rounded-2xl bg-gradient-to-br from-blue-500 to-indigo-600 flex items-center justify-center mb-3 sm:mb-4 shadow-lg shadow-blue-600/30 ring-1 ring-white/20">
        <svg class="w-6 h-6 sm:w-7 sm:h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/>
        </svg>
      </div>
      <h2 class="text-xl sm:text-2xl font-bold tracking-tight text-white whitespace-nowrap">CamGuard Viewer</h2>
      <p class="text-xs text-slate-400 mt-1">Sign in to connect &amp; monitor your camera</p>
    </div>

    <div id="loginError" class="hidden mb-4 p-3 rounded-xl bg-red-950/70 border border-red-800/80 text-red-300 text-xs text-center"></div>

    <form id="loginForm" class="space-y-3.5 sm:space-y-4">
      <div>
        <label class="text-xs font-medium text-slate-400 mb-1 block">Signaling Server URL</label>
        <input id="loginServerUrl" type="text" value="https://camera-app-backend-q7p5.onrender.com" placeholder="https://your-server.example.com" class="text-xs sm:text-sm" required />
      </div>
      <div>
        <label class="text-xs font-medium text-slate-400 mb-1 block">Email ID</label>
        <input id="loginEmail" type="email" placeholder="you@example.com" autocomplete="email" required />
      </div>
      <div>
        <label class="text-xs font-medium text-slate-400 mb-1 block">Password</label>
        <div class="relative">
          <input id="loginPassword" type="password" placeholder="Enter password" autocomplete="current-password" class="pr-16" required />
          <button type="button" id="btnTogglePwd" class="btn absolute right-2 top-1/2 -translate-y-1/2 text-slate-300 bg-slate-800/90 rounded-lg text-xs font-medium px-2.5 py-1" aria-label="Show or hide password">Show</button>
        </div>
      </div>
      <button id="btnLoginSubmit" type="submit" class="btn w-full bg-gradient-to-r from-blue-600 to-indigo-600 text-white py-3 sm:py-3.5 rounded-xl font-semibold text-sm mt-2 shadow-lg shadow-blue-600/25">
        🔐 Login &amp; Connect
      </button>
    </form>
  </div>
</div>

<!-- ══════════════════ MAIN APP ══════════════════ -->
<div id="appShell" class="hidden min-h-screen lg:h-screen lg:overflow-hidden flex flex-col">

  <!-- Desktop (lg, 100vh): Left (Camera Devices -> Signaling Server -> Terminal) | Right (email + logout -> Live Camera Stream)
       Mobile: Right (email + logout -> 80vh Live Camera Stream) -> Left (Camera Devices -> Signaling Server -> Terminal) -->
  <main class="max-w-[1600px] w-full mx-auto p-3 sm:p-4 grid grid-cols-1 lg:grid-cols-12 gap-3.5 flex-1 min-h-0">

    <!-- Left Column on Desktop (order-2 on Mobile, order-1 on Desktop) -->
    <aside class="order-2 lg:order-1 lg:col-span-4 flex flex-col gap-3.5 min-h-0">
      <div class="glass rounded-2xl p-3.5 sm:p-4 flex-shrink-0">
        <div class="flex items-center justify-between mb-2">
          <h3 class="text-xs font-semibold uppercase tracking-wider text-slate-300 flex items-center gap-2">
            <span>📷</span> Camera Devices
          </h3>
          <button id="btnRefresh" class="btn text-xs font-semibold text-blue-300 bg-blue-950/60 border border-blue-800/60 px-2.5 py-1 rounded-lg" disabled>↻ Refresh</button>
        </div>
        <div id="deviceList" class="space-y-2 max-h-28 overflow-y-auto pr-1">
          <div class="text-xs text-slate-500 text-center py-2">Searching for online cameras...</div>
        </div>
      </div>

      <div class="glass rounded-2xl p-3.5 sm:p-4 flex-shrink-0">
        <div class="flex items-center justify-between gap-2 mb-2.5">
          <h3 class="text-xs font-semibold uppercase tracking-wider text-slate-300 flex items-center gap-2">
            <span class="w-2 h-2 rounded-full bg-blue-400"></span> Signaling Server
          </h3>
          <div id="connBadge" class="flex items-center gap-1.5 px-2.5 py-1 rounded-full text-[11px] font-semibold bg-red-950/90 text-red-400 border border-red-900 flex-shrink-0">
            <span class="w-2 h-2 rounded-full bg-red-500"></span>
            <span>Disconnected</span>
          </div>
        </div>
        <div class="flex gap-2">
          <input id="serverUrlInput" type="text" value="https://camera-app-backend-q7p5.onrender.com" class="text-xs" />
          <button id="btnConnect" class="btn flex-shrink-0 bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-xl text-xs font-semibold">Reconnect</button>
        </div>
      </div>

      <div class="glass rounded-2xl p-4 flex flex-col h-64 lg:h-auto lg:flex-1 min-h-0">
        <div class="flex items-center justify-between pb-2.5 mb-2.5 border-b border-slate-800/80 flex-shrink-0">
          <div class="flex items-center gap-2">
            <span class="flex items-center gap-1.5">
              <span class="w-2.5 h-2.5 rounded-full bg-rose-500/80"></span>
              <span class="w-2.5 h-2.5 rounded-full bg-amber-400/80"></span>
              <span class="w-2.5 h-2.5 rounded-full bg-emerald-400/80"></span>
            </span>
            <h3 class="text-xs font-semibold uppercase tracking-wider text-slate-300 ml-1">Terminal</h3>
          </div>
          <button onclick="clearLog()" class="btn text-xs text-slate-300 px-2.5 py-1 rounded-lg bg-slate-800/80 border border-slate-700/60">Clear</button>
        </div>
        <div id="logEl" class="flex-1 min-h-0 overflow-y-auto bg-[#03060d] rounded-xl p-3 space-y-0.5 border border-slate-800/80"></div>
      </div>
    </aside>

    <!-- Right Column on Desktop (order-1 on Mobile, order-2 on Desktop) -->
    <section class="order-1 lg:order-2 lg:col-span-8 flex flex-col gap-3 min-h-0">
      <!-- Floating email pill + Logout button (No Navbar) -->
      <div class="flex items-center justify-between gap-2 flex-shrink-0">
        <div class="glass px-3.5 py-1.5 rounded-xl text-xs text-slate-300 truncate max-w-[68%] border border-slate-700/60">
          <span id="loggedInUserLabel" class="font-medium">Authenticated</span>
        </div>
        <button id="btnLogout" class="btn px-4 py-1.5 rounded-xl bg-slate-800/95 hover:bg-slate-700 text-xs font-semibold text-slate-100 border border-slate-700/80 flex-shrink-0">
          Logout
        </button>
      </div>

      <!-- Live Camera Stream: 80vh+20px on Mobile, fills remaining 100vh on Desktop -->
      <div class="glass rounded-2xl overflow-hidden h-[calc(80vh+20px)] lg:h-auto lg:flex-1 flex flex-col min-h-0">
        <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2 px-3 sm:px-4 py-2.5 border-b border-slate-800/80 bg-slate-900/35 flex-shrink-0">
          <div class="flex items-center gap-2.5">
            <span id="streamDot" class="w-2.5 h-2.5 rounded-full bg-slate-500"></span>
            <span id="streamLabel" class="text-sm font-semibold text-white">Standby (Select a Camera)</span>
          </div>
          <div class="grid grid-cols-2 sm:flex sm:flex-wrap items-center gap-2 w-full sm:w-auto">
            <button id="btnSwitchCamera" class="btn camera-btn w-full sm:w-auto text-center bg-blue-600/90 hover:bg-blue-500 text-white" disabled>🔄 Flip Camera</button>
            <button id="btnMuteAudio" class="btn camera-btn w-full sm:w-auto text-center bg-slate-800 hover:bg-slate-700 text-slate-100 border border-slate-700/70" disabled>🔊 Audio On</button>
            <button id="btnFullscreen" class="btn camera-btn w-full sm:w-auto text-center bg-slate-800 hover:bg-slate-700 text-slate-100 border border-slate-700/70">⛶ Fullscreen</button>
            <button id="btnScreenshot" class="btn camera-btn w-full sm:w-auto text-center bg-slate-800 hover:bg-slate-700 text-slate-100 border border-slate-700/70" disabled>📷 Snapshot</button>
          </div>
        </div>

        <div class="p-1.5 sm:p-3 bg-slate-950/40 flex-1 min-h-0 flex items-center justify-center">
          <div id="videoContainer">
            <video id="remoteVideo" autoplay playsinline muted></video>
            <canvas id="screenshotCanvas"></canvas>

            <div id="videoPlaceholder" class="absolute inset-0 flex flex-col items-center justify-center text-slate-400 bg-[#04070f] p-4 text-center">
              <div class="w-16 h-16 rounded-2xl bg-slate-900/90 border border-slate-800 flex items-center justify-center mb-3.5">
                <svg class="w-8 h-8 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/>
                </svg>
              </div>
              <p class="text-sm font-medium text-slate-300" id="placeholderText">Online camera dhoondh raha hai...</p>
            </div>

            <div id="liveBadge" class="absolute top-3 left-3 bg-red-600/95 backdrop-blur-sm text-white text-[11px] font-bold px-3 py-1 rounded-full flex items-center gap-1.5 shadow-lg hidden">
              <span class="w-2 h-2 rounded-full bg-white pulse"></span>
              LIVE
            </div>

            <div id="iceStateBadge" class="absolute top-3 right-3 text-[11px] font-mono bg-black/70 backdrop-blur-sm text-slate-200 px-2.5 py-1 rounded-lg border border-white/10 hidden">
              ICE: <span id="iceStateText">new</span>
            </div>
          </div>
        </div>

        <div class="flex flex-wrap items-center justify-between gap-2 px-4 py-3 border-t border-slate-800/80 bg-slate-900/40">
          <div class="flex items-center gap-4 text-xs text-slate-400">
            <span>Session: <span id="sessionIdLabel" class="font-mono text-slate-200">—</span></span>
            <span>ICE: <span id="iceState2" class="text-slate-200 font-mono">—</span></span>
          </div>
          <button id="btnDisconnect" class="btn camera-btn bg-red-600/90 hover:bg-red-500 text-white hidden">✕ Disconnect</button>
        </div>
      </div>
    </section>

  </main>
</div>

<script>
  document.getElementById('btnTogglePwd')?.addEventListener('click', () => {
    const pwd = document.getElementById('loginPassword');
    const btn = document.getElementById('btnTogglePwd');
    if (!pwd || !btn) return;
    const isHidden = pwd.type === 'password';
    pwd.type = isHidden ? 'text' : 'password';
    btn.textContent = isHidden ? 'Hide' : 'Show';
  });
</script>
<script src="app.js"></script>
</body>
</html>
